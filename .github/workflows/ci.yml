name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runners of a private repository have 2 cores and 7 GB: at most two compile jobs of Verilator.
  RTL_BENCH_JOBS: 2

jobs:
  tool:
    name: rtl-bench check, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Format, lint, unit tests
        run: |
          nix develop -c cargo fmt --check
          nix develop -c cargo clippy --all-targets -- -D warnings
          nix develop -c cargo test
      - name: Build and check the designs
        run: |
          nix develop -c cargo build --release
          nix develop -c target/release/rtl-bench check

  designs:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workloads are those that ran in under 60 s on the NAS (16 threads); a runner with 2 cores
          # needs longer. Left out, with their time on the NAS: opentitan.earlgrey otbn_smoketest (60 s),
          # boom.smallv3 dhrystone (128 s).
          - variant: wally.rv64gc
            workloads: ieu fpu coremark
          - variant: blackparrot.unicore
            workloads: demo rv64ui-p-simple rv64ui-p-add coremark
          - variant: vortex.default
            workloads: rv32ui-p-simple rv32ui-p-add
          # The model of OpenTitan took 78 s of wall time, 389 s of CPU and 2.3 GB at most (the Verilator
          # process) on the NAS; two compile jobs of about 1 GB each come on top, which fits 7 GB. This has
          # not been measured on a runner.
          - variant: opentitan.earlgrey
            workloads: test_rom uart_smoketest crt_test
          - variant: boom.smallv3
            workloads: rv64ui-p-simple rv64ui-p-add
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build rtl-bench
        run: nix develop -c cargo build --release
      - name: Elaborate the synthesis view with slang
        run: nix develop -c target/release/rtl-bench elaborate ${{ matrix.variant }}
      - name: Run the workloads in Verilator
        run: |
          for w in ${{ matrix.workloads }}; do
            nix develop -c target/release/rtl-bench sim ${{ matrix.variant }} "$w"
          done
