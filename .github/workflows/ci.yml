name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runners of a private repository have 2 cores and 7 GB: at most two compile jobs of Verilator.
  RTL_BENCH_JOBS: 2

jobs:
  tool:
    name: rtl-bench check, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Format, lint, unit tests
        run: |
          nix develop -c cargo fmt --check
          nix develop -c cargo clippy --all-targets -- -D warnings
          nix develop -c cargo test
      - name: Build and check the designs
        run: |
          nix develop -c cargo build --release
          nix develop -c target/release/rtl-bench check

  designs:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workloads are those that ran in under 60 s on the NAS (16 threads); a runner with 2 cores
          # needs longer. Left out, with their time on the NAS: opentitan.earlgrey otbn_smoketest (60 s),
          # boom.smallv3 dhrystone (128 s), caliptra.core smoke_test_mldsa (218 s) and smoke_test_ecc_sign
          # (496 s), gemmini.rocket16x16 tiled_matmul_ws (673 s) and conv (1170 s), saturn.rocketv256d128 vec-mixed_width_mask (61 s) and vec-igemm (619 s). Every workload of
          # naxriscv.rv64 is in: the longest, coremark, took 10 s on the NAS.
          - variant: wally.rv64gc
            workloads: ieu fpu coremark
          - variant: blackparrot.unicore
            workloads: demo rv64ui-p-simple rv64ui-p-add coremark
          - variant: vortex.default
            workloads: rv32ui-p-simple rv32ui-p-add
          # The model of OpenTitan took 78 s of wall time, 389 s of CPU and 2.3 GB at most (the Verilator
          # process) on the NAS; two compile jobs of about 1 GB each come on top, which fits 7 GB. This has
          # not been measured on a runner.
          - variant: opentitan.earlgrey
            workloads: test_rom uart_smoketest crt_test
          - variant: boom.smallv3
            workloads: rv64ui-p-simple rv64ui-p-add
          # The model of Caliptra took 425 s of wall time, 1767 s of CPU and 2.5 GB at most (the Verilator
          # process) on the NAS with 16 jobs; a runner with 2 cores needs about 15 minutes of wall
          # time for it (1767 s of CPU over 2 cores). This has not been measured on a runner.
          - variant: caliptra.core
            workloads: hello_world_iccm smoke_test_sha512
          # The model of Gemmini took 39 s of wall time, 209 s of CPU and 0.8 GB at most on the NAS with 16
          # jobs. This has not been measured on a runner.
          - variant: gemmini.rocket16x16
            workloads: rv64ui-p-simple template
          # The model of NaxRiscv (Verilator 4.228 and the Spike libraries from nix, which a runner builds first) took 13 s of
          # wall time, 78 s of CPU and 0.45 GB at most (the Verilator process) on the NAS with 16 jobs. This has not
          # been measured on a runner.
          - variant: naxriscv.rv64
            workloads: rv64ui-p-add rv64ui-p-sd rv64um-p-mul rv64ua-p-amoadd_d dhrystone coremark
          # The model of bsg-manycore.pod_1x1_4x2y took 34 s of wall time, 186 s of CPU and 4.1 GB at most (all processes, with the
          # first run) on the NAS with 16 jobs, and 92 s of wall time and 2.2 GB with 2 jobs; every workload took under 3 s. Left
          # out: bsg-manycore.pod_1x1 (128 tiles): its model took 546 s of wall time and 2212 s of CPU with 16 jobs, peaked at 15 GB
          # (the verilator process alone holds 4.1 GB during the C++ compile, with two compile jobs of up to 1.4 GB on top), and its
          # workloads took 41 s (hello), 63 s (bsg_mutex), 134 s (bsg_barrier_amoadd_test) and 158 s (vcache_atomic_inc).
          # Not measured on a runner.
          - variant: bsg-manycore.pod_1x1_4x2y
            workloads: hello bsg_mutex bsg_barrier_amoadd_test vcache_atomic_inc
          # The model of Saturn took 40 s of wall time, 233 s of CPU and 0.7 GB at most on the NAS with 16 jobs. This has not
          # been measured on a runner.
          - variant: saturn.rocketv256d128
            workloads: rv64ui-p-simple vec-strlen
          # Taxi: every workload is in. On the NAS (16 jobs) the models took 12 s (eth_phy_10g, 0.45 GB at most) and
          # 13 s (kc705_gmii, 0.45 GB at most) of wall time, and the workloads 2 s (each of the three of eth_phy_10g)
          # and 6 s. Left out: the elaboration of taxi.kc705_gmii with slang, which 12.1 does not do (`$size` of an array
          # of interfaces, recipe/README.md of taxi); Verilator builds it. Not measured on a runner.
          - variant: taxi.eth_phy_10g
            workloads: run_test_rx run_test_tx run_test_rx_frame_sync
          - variant: taxi.kc705_gmii
            workloads: run_test
            elaborate: "no"
          # xiangshan.minimal: elaboration only (slang took 1.4 s of wall time and 1.7 GB on the NAS). Its model is left out: it took
          # 1734 s of wall time and 6730 s of CPU with 16 jobs on the NAS and 8.4 GB for the verilator process alone (the compile
          # jobs, 1.4 GB each, come on top: 34 GB for all processes at the peak), which does not fit the 7 GB of a runner. The
          # workloads, coremark-2-iteration and microbench, took 1293 s and 513 s of simulation on the NAS.
          - variant: xiangshan.minimal
            workloads: ""
          # occamy: elaboration only (slang took 4.7 s of wall time and 0.7 GB for full, 1.0 s and 0.7 GB for q2c2 on the NAS). The
          # model of occamy.q2c2 is left out: it took 2314 s of wall time and 5700 s of CPU with 16 jobs on the NAS and 12 GB for the
          # verilator process alone, which does not fit the 7 GB of a runner; its workload, hello_world, took 280 s of simulation.
          # The model of occamy.full is estimated at 5 to 6 times that and was not built (recipe/README.md of occamy).
          - variant: occamy.full
            workloads: ""
          - variant: occamy.q2c2
            workloads: ""
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build rtl-bench
        run: nix develop -c cargo build --release
      - name: Elaborate the synthesis view with slang
        if: matrix.elaborate != 'no'
        run: nix develop -c target/release/rtl-bench elaborate ${{ matrix.variant }}
      - name: Run the workloads in Verilator
        run: |
          for w in ${{ matrix.workloads }}; do
            nix develop -c target/release/rtl-bench sim ${{ matrix.variant }} "$w"
          done
