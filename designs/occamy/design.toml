[design]
id = "occamy"
name = "Occamy"
description = "Many-core RISC-V system of ETH Zurich: a CVA6 host, Snitch clusters in quadrants, an AXI network and HBM2E ports, as its generator writes it."

# The generator is Occamy's own (util/occamygen and the Makefile of target/sim) at the commit below, run by
# recipe/generate.sh. Every dependency is at the revision of Bender.lock, not at the one that Bender.yml
# names: Bender.yml asks for the branch `occamy` of snitch_cluster, which no longer exists upstream, and
# Bender.lock has da57b043dfe0ba563a55a9d83bf362873c713648, which is reachable by hash only.
[source]
repository = "https://github.com/pulp-platform/occamy"
commit = "d5d0d8320bb633c36319e5477006d4c17cf0e448"
mode = "vendored"
# hw/ is Solderpad 0.51; util/ and sw/ are Apache-2.0 (src/occamy/LICENSE); the 9 files of CVA6 that say
# `Apache-2.0 WITH SHL-2.0` and apb_uart (LGPL-2.1-or-later in its file headers, no licence file) come
# with their texts in licences/ (recipe/fetch-licences.sh).
licence = "SHL-0.51 AND Apache-2.0 AND Apache-2.0 WITH SHL-2.0 AND LGPL-2.1-or-later"
licence_files = [
  "src/occamy/LICENSE",
  "src/occamy/hw/LICENSE",
  "licences/SHL-0.51.txt",
  "licences/SHL-2.0.txt",
  "licences/LGPL-2.1.txt",
]

# The dependencies of Bender.lock (and the three trees that Occamy carries in hw/vendor), with the commits
# of the lock files. The Solderpad texts of the repositories are the same as licences/SHL-0.51.txt.

