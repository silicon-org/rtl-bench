[design]
id = "boom"
name = "SonicBOOM"
description = "Out-of-order RISC-V core (SmallBoom) in the Chipyard SoC, as Chisel generates it."

[source]
repository = "https://github.com/ucb-bar/chipyard"
commit = "157dd69e49b9866be2bf8db390ee78bc38cd4438"
mode = "vendored"
licence = "BSD-3-Clause AND Apache-2.0 AND BSD-2-Clause"
licence_files = ["licences/chipyard/LICENSE", "licences/chipyard/LICENSE.SiFive"]

# The repositories whose code is in the generated RTL (the source locators of the Verilog name their
# files: boom, rocket-chip, the Chisel library, diplomacy, inclusive-cache, testchipip, hardfloat,
# chipyard, rocket-chip-blocks). The commits are those of the submodules of the Chipyard tag.

# SonicBOOM: its Scala generators, whose output is the core.
[[source.dependency]]
repository = "https://github.com/riscv-boom/riscv-boom"
commit = "ba03175e0a3cf5c0d5a7f14d385ac1c8998c4428"
